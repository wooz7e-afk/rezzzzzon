<body><div class="shell"><main id="app" class="screen"></main><nav class="bottom-nav" id="nav" aria-label="Основная навигация"></nav></div>
<script>
const IMG={tbilisi:'assets/tbilisi.png',eventNew:'assets/event-new.png',road:'assets/road.png',newturkey:'assets/turkey-new.png',logo:'assets/logo.svg',poster:'assets/poster.jpg',home:'assets/home.webp',georgia:'assets/georgia.webp',turkey:'assets/turkey.jpg',event:'assets/event.jpg'};
const PATH={home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10M9 20v-6h6v6"/>',catalog:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',bag:'<path d="M4 7h16v13H4z"/><path d="M8 7V5.5A2.5 2.5 0 0 1 10.5 3h3A2.5 2.5 0 0 1 16 5.5V7M4 11h16"/>',user:'<circle cx="12" cy="7" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1.1-1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8z"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',pin:'<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2.5"/>',book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5z"/><path d="M8 4v13"/>',check:'<path d="m5 12 4 4L19 6"/>',wallet:'<path d="M4 6h14a2 2 0 0 1 2 2v10H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h12"/><path d="M15 11h7v4h-7a2 2 0 0 1 0-4z"/>'};
function icon(n){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${PATH[n]||PATH.arrow}</svg>`}
const eventId='evening';const eventTitle='Вечер путешествий';let savedEvent=false;try{savedEvent=localStorage.getItem('rezonans-preview-event')==='1'}catch{}
const state={page:'home',catalog:'routes',profile:'trips',detail:'georgia',service:'visa',step:0,country:null,days:null,format:null,saved:savedEvent,notice:''};
const app=document.getElementById('app'),nav=document.getElementById('nav');
const destinations={georgia:{name:'Грузия',image:IMG.georgia,lead:'Тбилиси, горы, винные долины и дорога без спешки.',stops:[['01','Тбилиси','Город, в который легко вернуться.'],['02','Казбеги','Горные дороги и виды на Кавказ.'],['03','Кахетия','Вино, небольшие хозяйства и длинный ужин.']]},turkey:{name:'Каппадокия',image:IMG.newturkey,lead:'Рассветы с шарами, долины и маленькие города Турции.',stops:[['01','Рассвет','Воздушные шары над долинами.'],['02','Долины','Прогулки среди необычных скал.'],['03','Город','Кафе и спокойный вечер после маршрута.']]}};
function header(){return `<header class="topbar"><button class="logo-button" data-go="home" aria-label="REZONANS — главная"><img src="${IMG.logo}" alt="Логотип REZONANS"></button><div class="top-actions"><button class="round" data-go="profile" aria-label="Открыть профиль">${icon('user')}</button></div></header>`}
function navHTML(){let active=state.page==='detail'||state.page==='service'?'catalog':state.page==='builder'||state.page==='event'?'home':state.page;return [['home','Главная','home'],['catalog','Каталог','catalog'],['bonuses','Бонусы','heart'],['profile','Профиль','user']].map(([id,label,ico])=>`<button class="nav-item ${active===id?'active':''}" data-go="${id}" aria-label="${label}" ${active===id?'aria-current="page"':''}>${icon(ico)}<span>${label}</span></button>`).join('')}
function eventCard(){return `<article class="event-card"><img class="event-image" src="${IMG.eventNew}" alt="Встреча друзей во дворе старого Тбилиси"><div class="event-body"><div class="event-meta"><span class="eyebrow">REZONANS / Встречи</span><span>Анонс скоро</span></div><h3>${eventTitle}</h3><p>Знакомимся и говорим о маршрутах. Присоединиться можно одному или с друзьями.</p><div class="event-actions"><button class="event-save" data-action="save-event">${state.saved?'В профиле':'Сохранить'} ${state.saved?icon('check'):icon('heart')}</button><button class="event-open" data-action="event-info" aria-label="Подробнее о мероприятии">${icon('arrow')}</button></div><p class="subtle-note">Дата и место появятся после анонса.</p></div></article>`}
function home(){return `${header()}<section class="cover"><div class="cover-top"><div class="cover-eyebrow"><span>Путешествия REZONANS</span><span>Грузия / Турция</span></div><h1 class="poster-headline">ПОЕХАЛИ.</h1><p>Выберите готовый маршрут или соберите свой.</p></div><div class="cover-photo"><img src="${IMG.road}" alt="Горная дорога в лучах солнца — концептуальное фото для приложения"><span class="photo-chip">${icon('pin')} ГРУЗИЯ · КАВКАЗ</span></div><div class="cover-bottom"><div><strong>Ваше путешествие</strong><span>Страна, маршрут и детали — в одном месте.</span></div><button class="circle-cta" data-go="builder" aria-label="Собрать путешествие">${icon('arrow')}</button></div></section><section class="section"><div class="section-heading"><div><div class="eyebrow">Выберите формат</div><h2>Как поедем?</h2></div></div><div class="travel-options"><button class="travel-option primary-option" data-go="catalog" data-tab="routes">${icon('pin')}<strong>Готовые<br>маршруты</strong><span class="travel-option-footer"><small>Выбрать программу</small>${icon('arrow')}</span></button><button class="travel-option" data-action="start-builder">${icon('calendar')}<strong>Поездка<br>под себя</strong><span class="travel-option-footer"><small>Собрать маршрут</small>${icon('arrow')}</span></button></div></section><section class="section"><div class="section-heading"><div><div class="eyebrow">Два направления</div><h2>Куда поехать</h2></div><button class="text-link" data-go="catalog">Каталог ${icon('arrow')}</button></div><div class="country-list"><button class="country-card" data-detail="georgia"><img src="${IMG.tbilisi}" alt="Вид на старый Тбилиси и крепость Нарикала"><span class="country-info"><span><strong>Грузия</strong><small>Тбилиси · горы · Кахетия</small></span>${icon('arrow')}</span></button><button class="country-card" data-detail="turkey"><img src="${IMG.newturkey}" alt="Шары над долинами Каппадокии"><span class="country-info"><span><strong>Турция</strong><small>Каппадокия · рассветы</small></span>${icon('arrow')}</span></button></div></section><section class="section events-section" id="home-events"><div class="section-heading"><div><div class="eyebrow">Сообщество</div><h2>Мероприятия</h2></div><button class="text-link" data-profile="events">Мои ${icon('arrow')}</button></div>${eventCard()}</section><section class="section"><div class="service-strip"><div><h3>Документы для поездки</h3><p>Визы и водительское удостоверение.</p></div><button data-go="catalog" data-tab="services" aria-label="Открыть услуги">${icon('arrow')}</button></div></section><p class="prototype-tag">REZONANS · Дизайн для просмотра</p>`}
function catalog(){let routes=state.catalog==='routes', services=state.catalog==='services';return `${header()}<div class="page-head"><div class="eyebrow">REZONANS / Каталог</div><h1>Найдите своё.</h1><p>Маршруты, самостоятельные поездки и полезные услуги в одном месте.</p></div><div class="pill-row" role="tablist" aria-label="Разделы каталога"><button class="pill ${routes?'active':''}" data-catalog="routes" role="tab" aria-selected="${routes}">Маршруты</button><button class="pill ${state.catalog==='custom'?'active':''}" data-catalog="custom" role="tab" aria-selected="${state.catalog==='custom'}">Своя поездка</button><button class="pill ${services?'active':''}" data-catalog="services" role="tab" aria-selected="${services}">Услуги</button></div>${routes?Object.entries(destinations).map(([id,d])=>`<button class="catalog-card" data-detail="${id}"><img src="${d.image}" alt="${d.name}"><div class="card-copy"><div class="meta">${id==='georgia'?'Направление · Кавказ':'Направление · Турция'}</div><h3>${d.name}</h3><p>${d.lead}</p><div class="card-foot"><span>Открыть направление</span><b>↗</b></div></div></button>`).join(''):state.catalog==='custom'?`<div class="mini-builder-poster"><div class="text"><div class="eyebrow" style="color:#dee8ff">Индивидуальная поездка</div><h1>ПО ВАШЕМУ<br>МАРШРУТУ.</h1><p>Страна, длительность и ваши пожелания.</p></div><img src="${IMG.road}" alt="Дорога через горы"><button class="light-btn" data-action="start-builder">Собрать путешествие ${icon('arrow')}</button></div>`:`<div class="service-card"><div class="service-icon">${icon('book')}</div><div class="meta">Документы</div><h3>Виза</h3><p>Оставьте запрос: поможем разобраться с документами для выбранной страны.</p><button class="primary" data-service="visa">Оставить заявку ${icon('arrow')}</button></div><div class="service-card"><div class="service-icon">${icon('wallet')}</div><div class="meta">Документы</div><h3>Водительское удостоверение</h3><p>Запрос на консультацию по оформлению документа для поездки.</p><button class="primary" data-service="license">Оставить заявку ${icon('arrow')}</button></div><p class="footnote">Условия и сроки уточняются индивидуально. Заявки в этом дизайн-прототипе не отправляются.</p>`}`}
function detail(){let d=destinations[state.detail];return `${header()}<button class="back" data-go="catalog">‹ &nbsp; Каталог</button><img class="detail-photo" src="${d.image}" alt="${d.name}"><div class="detail-panel"><div class="eyebrow">Направление · REZONANS</div><h1>${d.name}</h1><p class="lead">${d.lead}</p><div class="facts"><span class="fact">Небольшие группы</span><span class="fact">Гибкий маршрут</span><span class="fact">Помощь с поездкой</span></div><section class="detail-section"><div class="eyebrow">В маршруте</div><h2>Главные остановки</h2><div class="stops">${d.stops.map(([num,title,desc])=>`<div class="stop"><b>${num}</b><div><strong>${title}</strong><p>${desc}</p></div></div>`).join('')}</div></section><section class="detail-section"><h2>Ваш темп</h2><p class="lead">Выберите длительность и формат при сборке поездки. Поможем адаптировать маршрут под вас.</p></section><div class="sticky-action"><button class="primary" data-action="build-country" style="width:100%">Собрать поездку в ${d.name==='Каппадокия'?'Турцию':'Грузию'} ${icon('arrow')}</button></div></div>`}
function builder(){const countryName=state.country==='turkey'?'Турция':'Грузия';const chosenImage=state.country==='turkey'?IMG.newturkey:IMG.road;return `${header()}<button class="back" data-action="builder-back">${icon('arrow')} ${state.step===0?'На главную':'Назад'}</button><div class="builder-title"><div class="eyebrow">Собрать путешествие · ${state.step+1} / 3</div><h1>${state.step===0?'СНАЧАЛА —<br>НАПРАВЛЕНИЕ.':state.step===1?'СКОЛЬКО<br>ДНЕЙ?':'ВАША<br>ПОЕЗДКА.'}</h1><p>${state.step===0?'Нажмите на страну, чтобы начать.':state.step===1?'Выберите длительность — затем обсудим детали.':'Оставьте контакт и расскажите, что важно для вас.'}</p></div><div class="builder-photo"><img src="${chosenImage}" alt="${state.country==='turkey'?'Каппадокия':'Дорога в горах Кавказа'}"><span class="builder-photo-label">${state.step===0?'REZONANS / В дорогу':countryName}</span><span class="photo-step">${state.step===2?state.days+' дней':'Ваш маршрут'}</span></div><section class="builder-step">${state.step===0?`<button class="select-tile" data-country="georgia"><img src="${IMG.georgia}" alt="Горы Грузии"><span><strong>Грузия</strong><small>Тбилиси, горы, Кахетия</small></span>${icon('arrow')}</button><button class="select-tile" data-country="turkey"><img src="${IMG.newturkey}" alt="Каппадокия"><span><strong>Турция</strong><small>Каппадокия и окрестности</small></span>${icon('arrow')}</button>`:state.step===1?`<div class="option-grid">${[3,5,7,10].map(n=>`<button class="option" data-days="${n}" aria-label="${n} ${n===3?'дня':'дней'}"><strong>${n} <span style="font:700 12px 'Manrope'">${n===3?'дня':'дней'}</span></strong><small>${n===3?'Короткая поездка':n===5?'Несколько остановок':n===7?'Полная неделя':'Больше времени на месте'}</small>${icon('arrow')}</button>`).join('')}</div>`:`<div class="summary"><div class="summary-row"><span>Страна</span><strong>${countryName}</strong></div><div class="summary-row"><span>Длительность</span><strong>${state.days} ${state.days===3?'дня':'дней'}</strong></div></div><form id="builder-form"><label class="form-field"><span>Ваше имя</span><input name="name" autocomplete="name" required placeholder="Как к вам обращаться"></label><label class="form-field"><span>Телефон или Telegram</span><input name="contact" required placeholder="Контакт для связи"></label><label class="form-field"><span>Пожелания</span><textarea name="message" placeholder="С кем едете и что хотели бы увидеть"></textarea></label><label class="check-row"><input type="checkbox" required><span>Согласен(на) на обработку данных для ответа на запрос.</span></label><button class="primary form-submit" type="submit">Проверить запрос ${icon('arrow')}</button></form>${state.notice?`<div class="notice" role="status">${state.notice}</div>`:''}<p class="footnote">В демонстрации данные не сохраняются и не отправляются.</p>`}</section>`}
function service(){let title=state.service==='visa'?'Виза':'Водительское удостоверение';return `${header()}<button class="back" data-go="catalog" data-tab="services">‹ &nbsp; Услуги</button><div class="page-head"><div class="eyebrow">Каталог / Документы</div><h1>${title}</h1><p>Расскажите, что вам нужно. В рабочей версии команда сможет ответить с подробностями.</p></div><div class="service-card"><div class="service-icon">${icon(state.service==='visa'?'book':'wallet')}</div><h3>Заявка на консультацию</h3><p>Короткая форма для первого обращения. Стоимость и сроки зависят от вашей ситуации.</p></div><form id="service-form"><label class="form-field"><span>Ваше имя</span><input name="name" autocomplete="name" required placeholder="Как к вам обращаться"></label><label class="form-field"><span>Телефон или Telegram</span><input name="contact" required placeholder="Контакт для связи"></label><label class="form-field"><span>${state.service==='visa'?'Страна назначения':'Страна поездки'}</span><input name="country" required placeholder="Укажите страну"></label><label class="form-field"><span>Комментарий</span><textarea name="message" placeholder="Что важно учесть"></textarea></label><label class="check-row"><input type="checkbox" required><span>Согласен(на) на обработку данных для ответа на запрос.</span></label><button class="primary form-submit" type="submit">Проверить заявку ${icon('arrow')}</button></form>${state.notice?`<div class="notice" role="status">${state.notice}</div>`:''}<p class="footnote">Это дизайн-прототип: заявка не отправляется, введённые данные не сохраняются.</p>`}
function profile(){return `${header()}<div class="page-head"><div class="eyebrow">REZONANS / Участник</div><h1>Профиль</h1><p>Ваши поездки, сохранённые мероприятия и бонусы в одном месте.</p></div><div class="profile-hero"><div class="eyebrow">REZONANS / Профиль</div><h3>ВАШИ ПЛАНЫ.</h3><p>Поездки, сохранённые мероприятия и бонусы от партнёров.</p></div><section class="section" style="margin-top:26px"><div class="pill-row" role="tablist" aria-label="Разделы профиля"><button class="pill ${state.profile==='trips'?'active':''}" data-profile="trips" role="tab" aria-selected="${state.profile==='trips'}">Поездки</button><button class="pill ${state.profile==='events'?'active':''}" data-profile="events" role="tab" aria-selected="${state.profile==='events'}">Мероприятия ${state.saved?'· 1':''}</button><button class="pill ${state.profile==='bonuses'?'active':''}" data-profile="bonuses" role="tab" aria-selected="${state.profile==='bonuses'}">Бонусы</button></div>${state.profile==='trips'?`<div class="empty"><h3>Пока без поездок</h3><p>Когда вы выберете маршрут, он появится в этом разделе.</p><button class="primary" data-go="catalog">Посмотреть маршруты <span>→</span></button></div>`:state.profile==='events'?state.saved?`${eventCard()}<p class="footnote">Событие сохранено только в этом браузере для демонстрации дизайна.</p>`:`<div class="empty"><h3>Сохранённых мероприятий пока нет</h3><p>Отметьте интересное событие на главной, и оно появится здесь.</p><button class="primary" data-go="home" data-scroll="home-events">Посмотреть мероприятия <span>→</span></button></div>`:`<div class="eyebrow" style="margin:3px 0 15px">Партнёрские возможности</div><h2 style="margin-bottom:18px">Бонусы в пути</h2><div class="bonus-item"><span class="choice-icon">${icon('pin')}</span><div><strong>Проживание</strong><p>Предложения партнёров появятся после подтверждения.</p></div></div><div class="bonus-item"><span class="choice-icon">${icon('bag')}</span><div><strong>Поездка и трансфер</strong><p>Преимущества для участников путешествий REZONANS.</p></div></div><div class="bonus-item"><span class="choice-icon">${icon('heart')}</span><div><strong>Мероприятия</strong><p>Специальные условия на встречи и события.</p></div></div><p class="footnote">Конкретные партнёры и условия будут добавлены после согласования.</p>`}</section>`}
function bonusContent(){return `<div class="bonus-hero"><img src="${IMG.logo}" alt=""><div><div class="eyebrow">REZONANS / Партнёры</div><h1 style="margin-top:17px">БОНУСЫ<br>В ПУТИ.</h1></div><p>Предложения наших партнёров для участников путешествий.</p></div><section class="section"><div class="section-heading"><h2>Для вашей поездки</h2></div><div class="bonus-item"><span class="choice-icon">${icon('pin')}</span><div><strong>Проживание</strong><p>Отели и гостевые дома.</p></div></div><div class="bonus-item"><span class="choice-icon">${icon('bag')}</span><div><strong>Трансферы и аренда</strong><p>Всё для дороги на месте.</p></div></div><div class="bonus-item"><span class="choice-icon">${icon('calendar')}</span><div><strong>Впечатления и встречи</strong><p>Мероприятия и локальные активности.</p></div></div><p class="footnote">Готовим список партнёров. Предложения появятся после согласования условий.</p></section>`}
function bonuses(){return `${header()}<div class="page-head" style="padding-top:10px"><div class="eyebrow">Бонусы участникам</div></div>${bonusContent()}`}
function eventDetail(){return `${header()}<button class="back" data-go="home" data-scroll="home-events">‹ &nbsp; Мероприятия</button><img class="detail-photo" src="${IMG.eventNew}" alt="Встреча во дворе старого Тбилиси"><div class="detail-panel"><div class="eyebrow">Сообщество · REZONANS</div><h1>${eventTitle}</h1><p class="lead">Встречаемся, знакомимся и говорим о путешествиях. Можно прийти одному или с друзьями.</p><div class="facts"><span class="fact">Дата — скоро</span><span class="fact">Место — после анонса</span></div><section class="detail-section"><h2>Что будет</h2><div class="stops"><div class="stop"><b>01</b><div><strong>Знакомство</strong><p>Спокойная встреча с другими участниками сообщества.</p></div></div><div class="stop"><b>02</b><div><strong>Разговор о маршрутах</strong><p>Идеи поездок и истории из дороги.</p></div></div></div></section><div class="sticky-action"><button class="primary" data-action="save-event" style="width:100%">${state.saved?'Убрать из сохранённых':'Сохранить в профиль'} <span class="button-icon">${state.saved?'×':'↗'}</span></button></div></div>`}
function render(){app.innerHTML=state.page==='home'?home():state.page==='catalog'?catalog():state.page==='detail'?detail():state.page==='builder'?builder():state.page==='service'?service():state.page==='bonuses'?bonuses():state.page==='event'?eventDetail():profile();nav.innerHTML=navHTML()}
function go(page,tab){state.page=page;if(tab)state.catalog=tab;state.notice='';render();window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{let el=e.target.closest('[data-go],[data-action],[data-detail],[data-service],[data-catalog],[data-profile],[data-country],[data-days]');if(!el)return;
 if(el.dataset.go){if(el.dataset.go==='builder'){state.step=0;state.country=null;state.days=null}go(el.dataset.go,el.dataset.tab);if(el.dataset.scroll)setTimeout(()=>document.getElementById(el.dataset.scroll)?.scrollIntoView({behavior:'smooth'}),30)}
 else if(el.dataset.catalog){state.catalog=el.dataset.catalog;render()}
 else if(el.dataset.detail){state.detail=el.dataset.detail;go('detail')}
 else if(el.dataset.service){state.service=el.dataset.service;go('service')}
 else if(el.dataset.profile){state.profile=el.dataset.profile;go('profile')}
 else if(el.dataset.country){state.country=el.dataset.country;state.step=1;render();window.scrollTo(0,0)}
 else if(el.dataset.days){state.days=Number(el.dataset.days);state.step=2;render();window.scrollTo(0,0)}
 else if(el.dataset.action==='save-event'){state.saved=!state.saved;try{localStorage.setItem('rezonans-preview-event',state.saved?'1':'0')}catch{};render()}
 else if(el.dataset.action==='event-info'){go('event')}
 else if(el.dataset.action==='start-builder'){state.step=0;state.country=null;state.days=null;go('builder')}
 else if(el.dataset.action==='build-country'){state.country=state.detail;state.step=1;go('builder')}
 else if(el.dataset.action==='builder-back'){if(state.step>0){state.step--;render()}else go('home')}
});
document.addEventListener('submit',e=>{if(e.target.id==='builder-form'||e.target.id==='service-form'){e.preventDefault();state.notice='Форма работает как демонстрация. Ваша заявка не отправлена, данные не сохранены.';const node=e.target.parentElement.querySelector('.notice');if(node)node.textContent=state.notice;else{let p=document.createElement('div');p.className='notice';p.setAttribute('role','status');p.textContent=state.notice;e.target.after(p)}e.target.reset()}});
render();
</script></body></html>
