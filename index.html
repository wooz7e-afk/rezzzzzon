<style>
/* ============ TOKENS ============ */
:root{
  --ink:#15120F;
  --ink-2:#1E1A16;
  --ink-3:#292420;
  --cream:#F4EEE2;
  --cream-dim:#E7DFCE;
  --terracotta:#C1602F;
  --terracotta-2:#E07A45;
  --blue:#3E5C74;
  --blue-2:#7C97AB;
  --lime:#D6F24C;
  --line: rgba(244,238,226,0.12);
  --text-soft: rgba(244,238,226,0.62);
  --overlay-fill: rgba(244,238,226,0.08);
  --placeholder: rgba(244,238,226,0.32);
  --chrome-blur: rgba(21,18,15,0.88);
  /* fixed regardless of theme — used for text sitting on photos, which
     always keep a dark scrim underneath, so the caption stays light */
  --on-media:#F7F2E7;
  --radius-l: 22px;
  --radius-m: 16px;
  --radius-s: 10px;
  --font-display:'Bricolage Grotesque', 'Inter', sans-serif;
  --font-body:'Inter', -apple-system, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
/* ============ LIGHT THEME ============
   Same component rules throughout the file reference these tokens for
   backgrounds/text/borders, so flipping the palette here re-themes the
   whole app. Photo captions intentionally stay on --on-media (fixed
   light) since they always sit on a dark image scrim in both themes. */
[data-theme="light"]{
  --ink:#F7F2E6;
  --ink-2:#FFFFFF;
  --ink-3:#EFE7D6;
  --cream:#1C1712;
  --cream-dim:#4A4239;
  --line: rgba(21,18,15,0.10);
  --text-soft: rgba(21,18,15,0.58);
  --overlay-fill: rgba(21,18,15,0.05);
  --placeholder: rgba(21,18,15,0.34);
  --chrome-blur: rgba(247,242,230,0.86);
}
[data-theme="light"] body::before{
  background:
    radial-gradient(60% 50% at 15% 10%, rgba(193,96,47,0.10), transparent 60%),
    radial-gradient(55% 45% at 88% 18%, rgba(62,92,116,0.12), transparent 60%),
    radial-gradient(70% 55% at 50% 100%, rgba(193,96,47,0.07), transparent 60%),
    var(--ink);
}
[data-theme="light"] #app{ box-shadow: 0 30px 80px -20px rgba(30,25,15,0.18), 0 0 0 1px rgba(21,18,15,0.06); }
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
html{ scroll-behavior:smooth; }
body{
  font-family: var(--font-body);
  background: var(--ink);
  color: var(--cream);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
  position:relative;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,textarea,select{font-family:inherit; color:inherit;}
a{color:inherit; text-decoration:none;}
::-webkit-scrollbar{display:none;}
/* Root cause of the oversized buttons: an inline <svg> with no width/height
   attribute defaults to 300x150px per spec. Every icon dropped into a
   button/link was silently blowing up its container. Size icons relative
   to their surrounding text by default; specific components below (nav,
   badges, empty states, etc.) still override this with their own size. */
svg{ width:1em; height:1em; display:inline-block; vertical-align:-0.15em; flex-shrink:0; }
*:focus-visible{ outline:2px solid var(--terracotta-2); outline-offset:2px; }

/* ---- ambient desktop backdrop: only visible when the mini app is
   previewed wide (browser/tablet); collapses to native full-bleed
   inside Telegram / on real phone widths ---- */
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(60% 50% at 15% 10%, rgba(193,96,47,0.16), transparent 60%),
    radial-gradient(55% 45% at 88% 18%, rgba(62,92,116,0.20), transparent 60%),
    radial-gradient(70% 55% at 50% 100%, rgba(193,96,47,0.10), transparent 60%),
    var(--ink);
  background-size: 140% 140%, 140% 140%, 140% 140%, auto;
  animation: driftBg 22s ease-in-out infinite alternate;
}
@keyframes driftBg{
  0%{ background-position: 0% 0%, 100% 0%, 50% 100%, 0 0; }
  100%{ background-position: 10% 15%, 85% 20%, 45% 90%, 0 0; }
}
/* fine film-grain overlay for a premium, non-flat 2026 surface */
body::after{
  content:''; position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.035; mix-blend-mode:overlay;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%25" height="100%25" filter="url(%23n)"/></svg>');
}

#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  background:var(--ink);
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  isolation:isolate;
}
/* #screens must grow to fill all leftover vertical space between the topbar
   and the bottom nav. Without this, screens with little content (e.g. empty
   "Мои поездки") are shorter than the viewport, so .bottomnav — a sticky
   element — has no scroll room to "stick" to and just sits right under the
   short content instead of pinned to the true bottom of the screen. */
#screens{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
#screens .screen{ flex:1 1 auto; }
.splash{
  position:absolute; inset:0; z-index:200;
  display:flex; align-items:center; justify-content:center;
  background:#15120F;
  transition: opacity .5s ease, visibility .5s ease;
}
.splash img{ width:84px; height:84px; padding:14px; border-radius:50%; background:#F4EEE2; box-sizing:border-box; animation: splashPulse 1.6s ease-in-out infinite; }
.splash.hide{ opacity:0; visibility:hidden; pointer-events:none; }
@keyframes splashPulse{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(0.94); opacity:.75; } }
@media (min-width:560px){
  body{ padding:36px 16px; }
  #app{
    min-height:calc(100vh - 72px);
    border-radius:32px;
    overflow:hidden;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.65), 0 0 0 1px rgba(244,238,226,0.06);
  }
  .bottomnav{ max-width:480px; margin:0 auto; border-radius: 0 0 32px 32px; }
}

/* ============ TOP BAR ============ */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  padding: calc(14px + var(--safe-top)) 18px 12px;
  background: var(--chrome-blur);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.brand{ display:flex; align-items:center; gap:9px; }
.brand-mark{
  width:32px; height:32px; object-fit:contain;
  flex-shrink:0;
  padding:5px; box-sizing:border-box; border-radius:50%; background:#F4EEE2;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
}
.brand-text{ font-family:var(--font-display); font-weight:700; font-size:16px; letter-spacing:0.5px; line-height:1;}
.brand-text small{ display:block; font-family:var(--font-body); font-weight:600; font-size:9px; letter-spacing:2.5px; color:var(--terracotta-2); margin-top:3px;}
.icon-btn{
  width:36px; height:36px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background: var(--overlay-fill); flex-shrink:0;
}
.icon-btn svg{ width:18px; height:18px; }
.topbar-actions{ display:flex; align-items:center; gap:8px; }
.back-row{ display:flex; align-items:center; gap:12px; }
.back-row .title{ font-family:var(--font-display); font-weight:700; font-size:17px; }

/* ============ SCREENS ============ */
.screen{ display:none; flex:1; padding-bottom: calc(84px + var(--safe-bottom)); }
.screen.active{ display:block; }
/* Screen switches render instantly with no fade/cross-fade animation.
   Previously this used a CSS fadein keyframe AND the native View
   Transitions API at the same time — both playing together made the old
   and new screen overlap for a frame, which showed up as doubled/
   "blinking" text on every navigation. Both are intentionally removed;
   do not reintroduce a transition/animation here. */

/* reveal-on-scroll utility — disabled (see afterRender()). Elements used
   to start hidden and fade in on every screen render, which produced the
   same blink/flash effect even for content already on screen. Cards now
   render at full opacity immediately; the class/rule is kept only so
   existing markup and JS references don't break. */
.reveal{ opacity:1; transform:none; }
.reveal.in{ opacity:1; transform:none; }

.section{ padding: 22px 18px 6px; }
.section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
.section-title{ font-family:var(--font-display); font-weight:700; font-size:19px; }
.section-link{ font-size:12.5px; font-weight:600; color:var(--terracotta-2); display:flex; align-items:center; gap:3px; }
.eyebrow{ font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--terracotta-2); margin-bottom:8px; }

/* ============ HERO ============ */
.hero{ position:relative; height:420px; overflow:hidden; }
.hero img{ width:100%; height:100%; object-fit:cover; display:block; }
.hero::after{
  content:''; position:absolute; inset:0;
  background: linear-gradient(180deg, rgba(21,18,15,0.15) 0%, rgba(21,18,15,0.15) 40%, rgba(21,18,15,0.94) 92%, rgba(21,18,15,1) 100%);
}
.hero-content{ position:absolute; left:0; right:0; bottom:0; padding:22px 18px 24px; z-index:2; color:var(--on-media); }
.hero-eyebrow{ font-size:11px; font-weight:700; letter-spacing:3px; color:var(--on-media); text-transform:uppercase; margin-bottom:10px; opacity:.85;}
.hero-title{ font-family:var(--font-display); font-weight:800; font-size:34px; line-height:1.02; letter-spacing:-0.5px; margin-bottom:14px; text-transform:uppercase; }
.hero-title .accent{
  background: linear-gradient(100deg, var(--terracotta-2), var(--lime) 130%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero img, .gd-hero img, .td-hero img{ will-change:transform; }
.parallax-img{ transform:scale(1.08); transition:transform .1s linear; }
.hero-sub{ font-size:13px; color:var(--on-media); opacity:.72; margin-bottom:18px; max-width:280px; line-height:1.5;}
.btn{
  position:relative; overflow:hidden;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:11px 18px; border-radius:100px; font-weight:700; font-size:13px;
  background: var(--terracotta); color:var(--on-media);
  transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease, filter .2s ease;
  box-shadow: 0 1px 0 rgba(255,255,255,0.08) inset, 0 6px 16px -10px rgba(193,96,47,0.55);
  white-space:nowrap;
}
.btn::after{
  content:''; position:absolute; inset:0; border-radius:inherit;
  background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.22) 45%, transparent 60%);
  background-size:220% 100%; background-position:120% 0; transition: background-position .55s ease;
  pointer-events:none;
}
.btn:hover::after{ background-position:-20% 0; }
.btn:active{ transform:scale(0.95); filter:brightness(0.96); }
.btn-block{ width:100%; }
.btn-ghost{ background: var(--overlay-fill); color:var(--cream); border:1px solid var(--line); box-shadow:none; }
/* variant for ghost buttons sitting on a photo (always-dark scrim underneath,
   independent of the app theme) — keeps them legible in both themes */
.btn-ghost.on-media{ background: rgba(247,242,230,0.14); color:var(--on-media); border-color: rgba(247,242,230,0.35); }
.btn-outline{ background:transparent; border:1.5px solid var(--terracotta); color:var(--terracotta); box-shadow:none; }
.btn-lg{ padding:13px 20px; font-size:14px; }
.btn-sm{ padding:7px 12px; font-size:11.5px; border-radius:100px; box-shadow:none; }
.btn[disabled]{ opacity:.45; pointer-events:none; }
.btn-row{ display:flex; gap:8px; align-items:center; }

/* quick grid on home */
.quickgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding: 16px 18px 4px; }
.quickcard{
  background: var(--ink-2); border:1px solid var(--line); border-radius: var(--radius-m);
  padding:16px 14px; display:flex; flex-direction:column; gap:24px;
}
.quickcard .qi{ width:34px; height:34px; border-radius:10px; background:rgba(224,122,69,0.14); display:flex; align-items:center; justify-content:center; }
.quickcard .qi svg{ width:17px; height:17px; stroke:var(--terracotta-2); }
.quickcard h4{ font-family:var(--font-display); font-size:14.5px; font-weight:700; }
.quickcard p{ font-size:11.5px; color:var(--text-soft); margin-top:3px; }

/* ============ CARDS: horizontal scroller ============ */
/* Drifts right on its own (see initHscrollAutoplay); no scroll-snap here
   since a snap-back on release is what previously read as "circular". */
.hscroll{ display:flex; gap:12px; overflow-x:auto; padding: 0 18px 6px; -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain; }
.hscroll::-webkit-scrollbar{ display:none; }
/* ---- guides moved into the Telegram chat/bot: promo block shown wherever
   the guide catalog used to render ---- */
.guides-in-chat{
  position:relative; overflow:hidden;
  padding:22px 20px; border-radius:var(--radius-l);
  background:
    radial-gradient(120% 140% at 0% 0%, rgba(214,242,76,0.10), transparent 55%),
    linear-gradient(135deg, rgba(193,96,47,0.18), rgba(62,92,116,0.18));
  border:1px solid var(--line);
  display:flex; flex-direction:column; align-items:flex-start; gap:10px;
}
.guides-in-chat .gic-icon{
  width:42px; height:42px; border-radius:12px; flex-shrink:0;
  background:rgba(244,238,226,0.14);
  display:flex; align-items:center; justify-content:center;
}
.guides-in-chat .gic-icon svg{ width:20px; height:20px; stroke:var(--lime); }
.guides-in-chat .gic-title{ font-family:var(--font-display); font-weight:700; font-size:16px; line-height:1.3; }
.guides-in-chat .gic-text{ font-size:12.5px; color:var(--text-soft); line-height:1.6; }
.guides-in-chat .btn{ margin-top:4px; }
.guides-in-chat.compact{ padding:18px; gap:8px; }
.guides-in-chat.compact .gic-title{ font-size:14.5px; }
.guides-in-chat.compact .gic-text{ font-size:12px; }

.gcard{ position:relative; flex:0 0 152px; height:196px; border-radius: var(--radius-m); overflow:hidden; scroll-snap-align:start; transition: transform .35s cubic-bezier(.16,1,.3,1); cursor:pointer; }
.gcard img{ width:100%; height:100%; object-fit:cover; transition: transform .5s cubic-bezier(.16,1,.3,1); background:var(--ink-3); }
@media (hover:hover){
  .gcard:hover{ transform:translateY(-4px); }
  .gcard:hover img{ transform:scale(1.06); }
  .tour-card:hover{ transform:translateY(-3px); box-shadow:0 20px 40px -20px rgba(0,0,0,0.5); }
  .person-card:hover, .event-card:hover, .quickcard:hover{ transform:translateY(-2px); border-color:rgba(224,122,69,0.4); }
}
.tour-card, .person-card, .event-card, .quickcard{ transition: transform .3s cubic-bezier(.16,1,.3,1), border-color .3s ease; }
.gcard::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg, transparent 40%, rgba(21,18,15,0.92) 100%); }
.gcard .gc-body{ position:absolute; left:12px; right:12px; bottom:12px; z-index:2; color:var(--on-media); }
.gcard .gc-name{ font-family:var(--font-display); font-weight:700; font-size:15px; }
.gcard .gc-meta{ font-size:10.5px; color:var(--on-media); opacity:.72; margin-top:2px; }
.badge{ position:absolute; top:10px; left:10px; z-index:2; font-size:9.5px; font-weight:700; letter-spacing:.4px; padding:4px 8px; border-radius:100px; background:rgba(21,18,15,0.55); color:var(--on-media); backdrop-filter:blur(6px); display:flex; align-items:center; gap:4px;}
.badge.verified{ background:rgba(193,96,47,0.85); }
.badge svg{ width:9px; height:9px; }
/* bookmark/save toggle sitting top-right on card photos, mirrors .badge on the left
   so the two never collide, and never shifts surrounding layout (always absolute) */
.save-btn{ position:absolute; top:8px; right:8px; z-index:3; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(21,18,15,0.55); backdrop-filter:blur(6px); color:var(--on-media); transition: background .2s ease, transform .15s ease; }
.save-btn svg{ width:14px; height:14px; }
.save-btn.active{ background:var(--terracotta); }
.save-btn:active{ transform:scale(0.88); }

/* ============ TOUR CARDS ============ */
.tour-card{ margin:0 18px 14px; border-radius: var(--radius-l); overflow:hidden; background:var(--ink-2); border:1px solid var(--line); }
.tour-card .tc-img{ position:relative; height:170px; }
.tour-card .tc-img img{ width:100%; height:100%; object-fit:cover; }
.tour-card .tc-body{ padding:15px 16px 16px; }
.tour-card .tc-dest{ font-family:var(--font-display); font-size:17px; font-weight:700; margin-bottom:4px;}
.tour-card .tc-idea{ font-size:12.5px; color:var(--text-soft); line-height:1.5; margin-bottom:12px; }
.tc-meta-row{ display:flex; gap:14px; margin-bottom:14px; }
.tc-meta{ display:flex; flex-direction:column; gap:2px; }
.tc-meta .v{ font-size:12.5px; font-weight:700; }
.tc-meta .l{ font-size:9.5px; color:var(--text-soft); text-transform:uppercase; letter-spacing:.5px; }

/* ============ LIST CARDS (people/events) ============ */
.person-card{ display:flex; gap:12px; margin:0 18px 12px; padding:14px; background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius-m); align-items:center; }
.person-card img{ width:58px; height:58px; border-radius:16px; object-fit:cover; flex-shrink:0; }
.pc-body{ flex:1; min-width:0; }
.pc-name-row{ display:flex; align-items:center; gap:6px; }
.pc-name{ font-family:var(--font-display); font-weight:700; font-size:14.5px; }
.pc-role{ font-size:11px; color:var(--terracotta-2); font-weight:600; margin-top:1px; }
.pc-loc{ font-size:11px; color:var(--text-soft); margin-top:4px; }
.pc-why{ font-size:11px; color:var(--text-soft); margin-top:5px; line-height:1.45; }
.seal{ width:15px; height:15px; flex-shrink:0; }

.event-card{ display:flex; gap:13px; margin:0 18px 12px; padding:14px; background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius-m); }
.event-card-tour{ background: linear-gradient(135deg, rgba(193,96,47,0.10), var(--ink-2) 55%); border-color: rgba(224,122,69,0.4); }
.event-date{ flex-shrink:0; width:52px; height:52px; border-radius:14px; background:rgba(224,122,69,0.14); display:flex; flex-direction:column; align-items:center; justify-content:center; }
.event-date .d{ font-family:var(--font-display); font-weight:800; font-size:17px; color:var(--terracotta-2); line-height:1; }
.event-date .m{ font-size:8.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--terracotta-2); margin-top:2px; }
.event-body{ flex:1; }
.event-title{ font-family:var(--font-display); font-weight:700; font-size:14px; margin-bottom:3px; }
.event-meta{ font-size:11px; color:var(--text-soft); margin-bottom:8px; }
.event-foot{ display:flex; align-items:center; justify-content:space-between; }
.event-spots{ font-size:10.5px; color:var(--blue-2); font-weight:600; }

/* chips / filters */
.chiprow{ display:flex; gap:8px; overflow-x:auto; padding:0 18px 16px; }
.chip{ flex-shrink:0; padding:8px 14px; border-radius:100px; border:1px solid var(--line); font-size:12px; font-weight:600; color:var(--text-soft); background:var(--ink-2); transition: all .25s cubic-bezier(.16,1,.3,1); }
.chip.active{ background:var(--terracotta); border-color:var(--terracotta); color:var(--cream); transform:scale(1.04); }

/* stats strip */
.stats{ display:flex; margin:18px 18px 0; padding:16px; background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius-m); justify-content:space-between; }
.stat{ text-align:center; }
.stat .v{ font-family:var(--font-display); font-weight:800; font-size:17px; }
.stat .l{ font-size:9px; color:var(--text-soft); text-transform:uppercase; letter-spacing:.5px; margin-top:2px; }

.cta-strip{ margin:18px 18px 6px; padding:16px; border-radius:var(--radius-m); background:linear-gradient(120deg, rgba(193,96,47,0.16), rgba(62,92,116,0.16)); border:1px solid var(--line); display:flex; align-items:center; gap:12px; justify-content:space-between; }
.cta-strip p{ font-size:12.5px; line-height:1.5; color:var(--cream); flex:1; }
.cta-strip strong{ font-family:var(--font-display); }

/* ============ BOTTOM NAV ============
   Fixed to the viewport (not sticky) so it always stays inside the
   phone's visible screen and scrolls together with it — sticky depends
   on the nearest scrolling ancestor's box, which on a real phone (esp.
   inside Telegram's WebView, where the viewport height itself keeps
   changing) can leave the nav trailing behind or pushed out of view.
   .screen already reserves calc(84px + safe-bottom) at its own bottom
   (see .screen rule below), so content never sits under the fixed bar. */
.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  background: var(--chrome-blur); backdrop-filter: blur(16px);
  border-top:1px solid var(--line);
  display:flex; padding: 9px 6px calc(9px + var(--safe-bottom));
}
.navitem{ position:relative; flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 2px; border-radius:12px; transition:transform .2s cubic-bezier(.34,1.56,.64,1); }
.navitem:active{ transform:scale(0.92); }
.navitem svg{ width:21px; height:21px; stroke:var(--text-soft); transition:stroke .2s ease, transform .3s cubic-bezier(.34,1.56,.64,1); }
.navitem span{ font-size:9.5px; font-weight:600; color:var(--text-soft); transition:color .2s ease; }
.navitem.active svg{ stroke:var(--terracotta-2); transform:translateY(-1px); }
.navitem.active span{ color:var(--terracotta-2); }
.navitem.active::before{
  content:''; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
  width:16px; height:3px; border-radius:3px; background:var(--terracotta-2);
  animation:navdot .3s cubic-bezier(.16,1,.3,1);
}
@keyframes navdot{ from{ width:0; opacity:0;} to{ width:16px; opacity:1;} }

/* ============ GUIDE DETAIL ============ */
.gd-hero{ position:relative; height:280px; }
.gd-hero img{ width:100%; height:100%; object-fit:cover; }
.gd-hero::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(21,18,15,0.1), rgba(21,18,15,1)); }
.gd-hero-body{ position:absolute; left:18px; right:18px; bottom:18px; z-index:2; color:var(--on-media); }
.gd-title{ font-family:var(--font-display); font-weight:800; font-size:28px; text-transform:uppercase; }
.gd-country{ font-size:12px; color:var(--on-media); opacity:.72; margin-top:2px;}
.gd-info-row{ display:flex; gap:8px; padding:16px 18px 4px; }
.info-pill{ flex:1; background:var(--ink-2); border:1px solid var(--line); border-radius:12px; padding:10px 8px; text-align:center; }
.info-pill .v{ font-size:12px; font-weight:700; }
.info-pill .l{ font-size:8.5px; color:var(--text-soft); text-transform:uppercase; letter-spacing:.4px; margin-top:2px; }

.tabs{ display:flex; gap:6px; overflow-x:auto; padding:18px 18px 14px; border-bottom:1px solid var(--line); }
.tab{ flex-shrink:0; padding:9px 15px; border-radius:100px; font-size:12.5px; font-weight:600; color:var(--text-soft); background:var(--ink-2); border:1px solid var(--line); transition: all .25s cubic-bezier(.16,1,.3,1); }
.tab.active{ background:var(--terracotta); color:var(--cream); border-color:var(--terracotta); transform:scale(1.04); }
.tabpanels{ padding:18px; }
.tabpanel{ display:none; }
.tabpanel.active{ display:block; animation:tabin .32s cubic-bezier(.16,1,.3,1); }
@keyframes tabin{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }

.place-row{ display:flex; gap:12px; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); }
.place-row:last-child{ border-bottom:none; }
.place-row img{ width:52px; height:52px; border-radius:12px; object-fit:cover; flex-shrink:0; }
.place-row .pn{ font-weight:700; font-size:13.5px; }
.place-row .pt{ font-size:11px; color:var(--text-soft); margin-top:2px; }
.tag{ font-size:9.5px; padding:3px 7px; border-radius:6px; background:rgba(124,151,171,0.18); color:var(--blue-2); font-weight:600; margin-top:4px; display:inline-block;}

.route-tabs{ display:flex; gap:8px; margin-bottom:14px; }
.route-tab{ flex:1; text-align:center; padding:9px 4px; border-radius:10px; background:var(--ink-2); border:1px solid var(--line); font-size:12px; font-weight:700; transition: all .25s cubic-bezier(.16,1,.3,1); }
.route-tab.active{ background:rgba(224,122,69,0.16); border-color:var(--terracotta); color:var(--terracotta-2); transform:translateY(-1px); }
.day-block{ display:flex; gap:12px; padding:12px 0; border-left:2px solid var(--line); padding-left:16px; margin-left:6px; position:relative; }
.day-block::before{ content:''; position:absolute; left:-6px; top:14px; width:10px; height:10px; border-radius:50%; background:var(--terracotta); }
.day-block .dn{ font-size:10.5px; font-weight:700; color:var(--terracotta-2); text-transform:uppercase; letter-spacing:.5px; }
.day-block .dt{ font-size:13px; font-weight:600; margin-top:3px; line-height:1.5;}

.info-card{ background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px 15px; margin-bottom:10px; }
.info-card h5{ font-size:12.5px; font-weight:700; margin-bottom:4px; display:flex; align-items:center; gap:6px;}
.info-card p{ font-size:12px; color:var(--text-soft); line-height:1.55; }

.safety-block{ background:linear-gradient(135deg, rgba(193,96,47,0.14), rgba(21,18,15,0)); border:1px solid rgba(224,122,69,0.35); border-radius:var(--radius-m); padding:16px; margin-bottom:14px; }
.safety-block .sh{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.safety-block .sh svg{ width:18px; height:18px; stroke:var(--terracotta-2); }
.safety-block .sh h4{ font-family:var(--font-display); font-weight:700; font-size:14.5px; }
.safety-item{ display:flex; gap:9px; font-size:12px; color:var(--text-soft); line-height:1.5; padding:6px 0; }
.safety-item .dot{ width:5px; height:5px; border-radius:50%; background:var(--terracotta-2); margin-top:6px; flex-shrink:0; }

.bonus-row{ display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; }
.bonus-chip{ flex-shrink:0; width:130px; background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius-m); padding:12px; }
.bonus-chip svg{ width:18px; height:18px; stroke:var(--terracotta-2); margin-bottom:8px; }
.bonus-chip .bt{ font-size:11.5px; font-weight:700; line-height:1.35; }

/* ============ TOUR DETAIL ============ */
.td-hero{ position:relative; height:320px; }
.td-hero img{ width:100%; height:100%; object-fit:cover; }
.td-hero::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(21,18,15,0.05) 30%, rgba(21,18,15,1)); }
.td-hero-body{ position:absolute; left:18px; right:18px; bottom:18px; z-index:2; color:var(--on-media); }
.td-dest{ font-family:var(--font-display); font-weight:800; font-size:26px; text-transform:uppercase; line-height:1.05;}
.td-idea{ font-size:12.5px; color:var(--on-media); opacity:.78; margin-top:8px; line-height:1.5; max-width:320px;}
.included-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.inc-item, .exc-item{ font-size:12px; padding:9px 10px; border-radius:10px; background:var(--ink-2); border:1px solid var(--line); display:flex; gap:7px; align-items:flex-start; line-height:1.4;}
.inc-item svg{ stroke:#7FBF6A; width:13px; height:13px; margin-top:2px; flex-shrink:0;}
.exc-item svg{ stroke:#B85C5C; width:13px; height:13px; margin-top:2px; flex-shrink:0;}
.faq-item{ border-bottom:1px solid var(--line); padding:13px 0; }
.faq-q{ font-size:13px; font-weight:700; display:flex; justify-content:space-between; align-items:center; }
.faq-a{ font-size:12px; color:var(--text-soft); margin-top:8px; line-height:1.55; display:none; }
.faq-item.open .faq-a{ display:block; }
.faq-item.open .faq-q svg{ transform:rotate(45deg); }
.faq-q svg{ width:14px; height:14px; transition:transform .2s; flex-shrink:0; }

.sticky-cta{ position:sticky; bottom:0; padding:14px 18px calc(14px + var(--safe-bottom)); background:linear-gradient(0deg, var(--ink) 60%, transparent); z-index:20; margin-top:10px;}
.price-row{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; padding:0 2px;}
.price-row .from{ font-size:10.5px; color:var(--text-soft); text-transform:uppercase; letter-spacing:.5px;}
.price-row .val{ font-family:var(--font-display); font-weight:800; font-size:19px; }

/* ============ FORMS ============ */
.form-wrap{ padding:18px; }
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:12px; font-weight:700; margin-bottom:8px; color:var(--cream); }
.field .hint{ font-size:10.5px; color:var(--text-soft); font-weight:400; margin-left:6px; }
.field input, .field textarea, .field select{
  width:100%; background:var(--ink-2); border:1.5px solid var(--line); border-radius:12px;
  padding:13px 14px; font-size:13.5px; color:var(--cream);
}
.field input::placeholder, .field textarea::placeholder{ color:var(--placeholder); }
.field input:focus, .field textarea:focus, .field select:focus{ outline:none; border-color:var(--terracotta); }
.field textarea{ resize:vertical; min-height:78px; }
.pillselect{ display:flex; flex-wrap:wrap; gap:8px; }
.pillopt{ display:inline-flex; align-items:center; gap:5px; padding:9px 14px; border-radius:100px; border:1.5px solid var(--line); font-size:12.5px; font-weight:600; color:var(--text-soft); background:var(--ink-2); transition: all .25s cubic-bezier(.16,1,.3,1); }
.theme-check{ display:none; width:14px; height:14px; }
.pillopt.sel .theme-check{ display:inline-flex; }
.pillopt.sel{ background:rgba(224,122,69,0.18); border-color:var(--terracotta); color:var(--terracotta-2); }
.stepper{ display:flex; align-items:center; gap:16px; background:var(--ink-2); border:1.5px solid var(--line); border-radius:12px; padding:6px 14px; width:fit-content;}
.date-range-row{ display:flex; align-items:center; gap:8px; }
.date-range-item{ flex:1; background:var(--ink-2); border:1.5px solid var(--line); border-radius:12px; padding:8px 12px; transition:border-color .2s ease; }
.date-range-item:focus-within{ border-color:var(--terracotta); }
.date-range-label{ display:block; font-size:9.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--text-soft); margin-bottom:2px; }
.date-range-item input[type="date"]{ width:100%; background:none; border:none; padding:0; font-size:13px; font-weight:600; color-scheme: dark; }
[data-theme="light"] .date-range-item input[type="date"]{ color-scheme: light; }
.date-range-sep{ flex-shrink:0; width:14px; height:14px; color:var(--text-soft); }
.date-range-nights{ font-size:11.5px; color:var(--terracotta-2); font-weight:600; margin-top:8px; }
.field.invalid .date-range-item{ border-color:#B85C5C; }
.stepbtn{ width:30px; height:30px; border-radius:50%; background:var(--overlay-fill); font-size:17px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.stepval{ font-weight:700; font-size:15px; min-width:20px; text-align:center; }
.error-msg{ font-size:11px; color:#E08A6A; margin-top:6px; display:none; }
.field.invalid input, .field.invalid textarea{ border-color:#B85C5C; }
.field.invalid .error-msg{ display:block; }

.form-intro{ background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px; margin-bottom:20px; }
.form-intro h3{ font-family:var(--font-display); font-size:17px; margin-bottom:6px; }
.form-intro p{ font-size:12px; color:var(--text-soft); line-height:1.5; }

/* ============ MODAL / TOAST ============ */
.overlay{ position:absolute; inset:0; background:rgba(21,18,15,0.72); backdrop-filter:blur(4px); z-index:90; display:none; align-items:flex-end; justify-content:center; }
.overlay.active{ display:flex; animation:overlayin .25s ease; }
@keyframes overlayin{ from{ opacity:0; } to{ opacity:1; } }
.sheet{ width:100%; background:var(--ink-2); border-radius:24px 24px 0 0; padding:26px 22px calc(26px + var(--safe-bottom)); text-align:center; animation:sheetup .38s cubic-bezier(.16,1,.3,1); }
@keyframes sheetup{ from{ transform:translateY(40px); opacity:0;} to{transform:translateY(0); opacity:1;} }
.sheet .sicon{ width:56px; height:56px; border-radius:50%; background:rgba(127,191,106,0.15); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
.sheet .sicon svg{ width:26px; height:26px; stroke:#7FBF6A; }
.sheet h3{ font-family:var(--font-display); font-size:18px; margin-bottom:8px; }
.sheet p{ font-size:12.5px; color:var(--text-soft); line-height:1.55; margin-bottom:20px; }

.toast{ position:absolute; left:50%; bottom:100px; transform:translateX(-50%); background:var(--cream); color:var(--ink); font-size:12.5px; font-weight:600; padding:12px 18px; border-radius:100px; z-index:95; opacity:0; pointer-events:none; transition:opacity .25s, bottom .25s; max-width:80%; text-align:center; box-shadow:0 12px 30px -8px rgba(0,0,0,0.4); }
.toast.show{ opacity:1; bottom:120px; }

/* ============ COMMUNITY / PROFILE ============ */
.comm-hero{ margin:18px; padding:26px 20px; border-radius:var(--radius-l); background: linear-gradient(150deg, var(--terracotta), #8f4423); text-align:center; }
.comm-hero h2{ font-family:var(--font-display); font-size:21px; font-weight:800; margin-bottom:8px; }
.comm-hero p{ font-size:12.5px; color:rgba(21,18,15,0.75); line-height:1.5; margin-bottom:18px; }
.comm-links{ display:flex; flex-direction:column; gap:10px; padding:0 18px; }
.comm-link{ display:flex; align-items:center; gap:13px; padding:15px 16px; background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius-m); }
.comm-link .cl-icon{ width:42px; height:42px; border-radius:12px; background:rgba(224,122,69,0.15); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.comm-link .cl-icon svg{ width:20px; height:20px; stroke:var(--terracotta-2); }
.comm-link .cl-body{ flex:1; }
.comm-link .cl-title{ font-weight:700; font-size:13.5px; }
.comm-link .cl-sub{ font-size:11px; color:var(--text-soft); margin-top:1px; }

.profile-head{ display:flex; align-items:center; gap:14px; padding:20px 18px; }
.profile-avatar{ width:58px; height:58px; border-radius:18px; background:linear-gradient(150deg, var(--terracotta-2), var(--terracotta)); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:20px; }
.profile-name{ font-family:var(--font-display); font-weight:700; font-size:17px; }
.profile-sub{ font-size:11.5px; color:var(--text-soft); margin-top:2px; }
.menu-list{ padding:0 18px; }
.menu-row{ display:flex; align-items:center; gap:13px; padding:15px 4px; border-bottom:1px solid var(--line); }
.menu-row svg{ width:18px; height:18px; stroke:var(--text-soft); }
.menu-row .mt{ flex:1; font-size:13.5px; font-weight:600; }
.menu-row .mc{ font-size:11px; color:var(--text-soft); background:var(--ink-3); padding:2px 9px; border-radius:100px;}
.empty-state{ text-align:center; padding:50px 30px; }
.empty-state svg{ width:40px; height:40px; stroke:var(--text-soft); margin-bottom:14px; }
.empty-state p{ font-size:12.5px; color:var(--text-soft); line-height:1.5; }

/* map placeholder */
.map-box{ height:210px; border-radius:var(--radius-m); background: var(--ink-2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="400" height="300" fill="%231E1A16"/><path d="M0 60 Q100 20 200 70 T400 50" stroke="%23292420" stroke-width="2" fill="none"/><path d="M0 150 Q120 110 220 160 T400 140" stroke="%23292420" stroke-width="2" fill="none"/><path d="M0 240 Q100 200 200 250 T400 230" stroke="%23292420" stroke-width="2" fill="none"/></svg>') center/cover; border:1px solid var(--line); position:relative; overflow:hidden; margin-bottom:14px;}
.map-pin{ position:absolute; width:11px; height:11px; border-radius:50%; background:var(--terracotta); box-shadow:0 0 0 5px rgba(224,122,69,0.22); }
.map-hint{ position:absolute; bottom:10px; left:10px; right:10px; font-size:10.5px; color:var(--text-soft); background:rgba(21,18,15,0.65); padding:8px 10px; border-radius:10px; backdrop-filter:blur(6px);}

.divider-label{ display:flex; align-items:center; gap:10px; padding:20px 18px 4px; }
.divider-label span{ font-size:10.5px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-soft); white-space:nowrap;}
.divider-label .ln{ height:1px; background:var(--line); flex:1; }

.skeleton{ animation:pulse 1.3s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{opacity:.5} 50%{opacity:1} }

img{ background:var(--ink-3); }
img.imgload{ opacity:0; transition:opacity .5s ease; }
img.imgload.loaded{ opacity:1; }

/* count-up stat numbers */
.stat .v{ font-variant-numeric:tabular-nums; }

</style>

</head>

/* ================= DIRECTUS: загрузка контента ================= */
// TODO: вписать сюда адрес вашего Directus после установки, например:
// const DIRECTUS_URL = 'https://cms.rezonans-travel.ru';
const DIRECTUS_URL = 'https://cms.rezonanstravel.ru';

let REZONANS_DATA = REZONANS_FALLBACK; // пока не загрузили — показываем запасные данные

function mediaUrl(fileId){
  if(!fileId) return '';
  if(typeof fileId === 'string' && /^https?:\/\//.test(fileId)) return fileId;
  return `${DIRECTUS_URL}/assets/${fileId}`;
}
async function dGet(collection, query=''){
  const res = await fetch(`${DIRECTUS_URL}/items/${collection}${query}`);
  if(!res.ok) throw new Error('Directus: не удалось получить ' + collection);
  const json = await res.json();
  return json.data || [];
}
function groupBy(arr, key){
  return arr.reduce((acc, item) => { (acc[item[key]] = acc[item[key]] || []).push(item); return acc; }, {});
}

/* Забирает 6 коллекций из Directus и собирает их в ту же структуру,
   в которой раньше был зашит REZONANS_DATA — благодаря этому весь остальной
   код приложения (screens, рендеры) не пришлось переписывать. Вложенные
   списки (места, маршруты, программа, faq и т.д.) хранятся в Directus прямо
   внутри карточки как поля-списки — сотрудник добавляет строки кнопкой
   "+ добавить", без единой строчки JSON. */
async function loadRezonansData(){
  const [statsRows, guidesRaw, toursRaw, people, events] = await Promise.all([
    dGet('stats'),
    dGet('guides', '?sort=sort'),
    dGet('tours', '?sort=sort'),
    dGet('people'),
    dGet('events')
  ]);

  const guides = guidesRaw.map(g => {
    const routes = {};
    (g.routes || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0)).forEach(r => {
      if(!routes[r.duration]) routes[r.duration] = [];
      routes[r.duration].push({ title: r.title });
    });
    const safety = { scams: [], overpay: [], avoid: [], watch: [] };
    (g.safety || []).forEach(s => { if(safety[s.category]) safety[s.category].push(s.text); });
    return {
      id: g.id, title: g.title, shortDesc: g.short_desc, cover: mediaUrl(g.cover),
      updated: g.updated, timezone: g.timezone, currency: g.currency, lang: g.lang, bestTime: g.best_time,
      about: g.about,
      places: (g.places || []).map(p => ({ img: mediaUrl(p.img), name: p.name, type: p.type })),
      routes,
      importantInfo: g.important_info || [],
      safety,
      people: g.people || [],
      bonuses: g.bonuses || []
    };
  });

  const tours = toursRaw.map(t => ({
    id: t.id, dest: t.dest, label: t.label, cover: mediaUrl(t.cover), idea: t.idea,
    dates: t.dates, days: t.days, people: t.people_range, priceFrom: t.price_from,
    route: t.route || [],
    program: t.program || [],
    stay: t.stay,
    activities: t.activities || [],
    team: t.team, localPerson: t.local_person,
    included: t.included || [],
    excluded: t.excluded || [],
    safety: t.safety,
    faq: t.faq || []
  }));

  const stats = statsRows || {};
  REZONANS_DATA = {
    stats: { travelers: stats.travelers || '', countries: stats.countries || '', reach: stats.reach || '' },
    guides, tours,
    people: people.map(p => ({
      id: p.id, name: p.name, role: p.role, city: p.city, country: p.country,
      category: p.category, img: mediaUrl(p.img), why: p.why, does: p.does
    })),
    events: events.map(e => ({
      id: e.id, title: e.title, when: e.when, day: e.day, month: e.month, where: e.where,
      desc: e.desc, organizer: e.organizer, spots: e.spots, price: e.price, tourId: e.tour || undefined
    }))
  };
}

/* ---------- data getters (used everywhere in the app) ---------- */
function getGuide(id){ return REZONANS_DATA.guides.find(g => g.id === id); }
function getTour(id){ return REZONANS_DATA.tours.find(t => t.id === id); }
function getPerson(id){ return REZONANS_DATA.people.find(p => p.id === id); }
function getEvent(id){ return REZONANS_DATA.events.find(e => e.id === id); }

</script>

/* ---------- TELEGRAM INTEGRATION ---------- */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
function initTelegram(){
  if(!tg) return;
  try{
    tg.ready();
    tg.expand();
    tg.setHeaderColor && tg.setHeaderColor('#15120F');
    tg.setBackgroundColor && tg.setBackgroundColor('#15120F');
    tg.enableClosingConfirmation && tg.enableClosingConfirmation();
  }catch(e){ console.warn('Telegram init warning', e); }
}
function haptic(style){
  if(tg && tg.HapticFeedback){
    try{
      if(style==='success' || style==='error' || style==='warning') tg.HapticFeedback.notificationOccurred(style);
      else tg.HapticFeedback.impactOccurred(style || 'light');
    }catch(e){}
  }
}
function sendToBot(payload){
  // Заявка сохраняется напрямую в Directus (коллекция leads), с keepalive —
  // чтобы запрос гарантированно доходил, даже если пользователь тут же
  // закроет мини-апп сам.
  // ВАЖНО: раньше здесь также вызывался tg.sendData(...) — но именно этот
  // вызов, по правилам Telegram, автоматически ЗАКРЫВАЕТ мини-апп сразу
  // после отправки, из-за чего пользователь не видел экран подтверждения
  // "Заявка отправлена" (showResultSheet). Убрано намеренно.
  fetch(`${DIRECTUS_URL}/items/leads`, {
    method: 'POST',
    keepalive: true,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      type: payload.type || '',
      name: payload.name || '',
      contact: payload.contact || '',
      people_count: payload.people || null,
      comment: payload.comment || payload.mustSee || '',
      ref_id: payload.refId || '',
      ref_label: payload.refLabel || payload.destination || '',
      raw_payload: payload
    })
  }).catch(e => console.warn('Не удалось отправить заявку в Directus', e));
  return true;
}

/* ---------- ANALYTICS (раздел 14 ТЗ) ----------
   Единая точка трекинга событий воронки:
   Instagram → Telegram → Mini App → продукт → заявка/покупка.
   Сейчас пишет в консоль + локальный буфер — в проде достаточно
   заменить track() на отправку в Amplitude/Mixpanel/своё API. */
const ANALYTICS_LOG = [];
function track(event, props){
  const entry = { event, props: props||{}, ts: new Date().toISOString() };
  ANALYTICS_LOG.push(entry);
  console.log('[analytics]', event, props||{});
}

/* ---------- ROUTER ---------- */
function go(screen, params){
  STATE.screen = screen;
  STATE.params = params || {};
  track('screen_view', { screen, ...STATE.params });
  // Screens switch instantly, no cross-fade/animation. This used to run
  // through document.startViewTransition (native cross-fade) while the CSS
  // also played its own fadein keyframe on the new screen — both firing at
  // once made the old and new screen briefly overlap, which looked like a
  // blink/flicker on every navigation. Do not reintroduce either.
  render();
  // 'instant' forces an immediate jump and overrides the global CSS
  // scroll-behavior:smooth — without it, screen switches would visibly
  // animate-scroll back up to the top instead of snapping there right away.
  window.scrollTo({ top:0, left:0, behavior:'instant' });
  haptic('light');
}

function render(){
  renderTopbar();
  renderBottomNav();
  const root = document.getElementById('screens');
  let html = '';
  switch(STATE.screen){
    case 'home': html = screenHome(); break;
    case 'guides': html = screenGuides(); break;
    case 'guide-detail': html = screenGuideDetail(STATE.params.id); break;
    case 'tours': html = screenTours(); break;
    case 'tour-detail': html = screenTourDetail(STATE.params.id); break;
    case 'build-trip': html = screenBuildTrip(); break;
    case 'people': html = screenPeople(); break;
    case 'events': html = screenEvents(); break;
    case 'community': html = screenCommunity(); break;
    case 'profile': html = screenProfile(); break;
    case 'my-guides': html = screenMyGuides(); break;
    case 'my-tours': html = screenMyTours(); break;
    case 'my-applications': html = screenMyApplications(); break;
    case 'saved-places': html = screenSavedPlaces(); break;
    default: html = screenHome();
  }
  root.innerHTML = `<div class="screen active">${html}</div>`;
  afterRender();
}

const buildTripDraft = { destination:'', dateFrom:'', dateTo:'', people:2, budget:'', interests:[], pace:'', mustSee:'', avoid:'', contact:'' };
function screenBuildTrip(){
  const interestsList = ['Природа','Еда','История','Активный отдых','Пляж','Ночная жизнь','Фотография','Уединение'];

  const nights = tripNights();
  return `

          <span class="date-range-label">По</span>
          <input type="date" min="${buildTripDraft.dateFrom || todayISO}" value="${buildTripDraft.dateTo}" onchange="setTripDate('to', this.value)">
        </div>
      </div>
      <div class="date-range-nights" id="date-range-nights">${nights ? `${nights} ${nightsWord(nights)} путешествия` : 'Выберите даты «с» и «по»'}</div>
      <div class="error-msg">Дата «по» не может быть раньше даты «с»</div>
    </div>

    <div class="field">
      <label>Сколько человек</label>
      <div class="stepper">
        <button type="button" class="stepbtn" onclick="stepPeople(-1)">–</button>

      <label>Бюджет на человека</label>
      <input type="text" placeholder="Например, 800–1200$" value="${buildTripDraft.budget}" oninput="buildTripDraft.budget=this.value">
    </div>

    <div class="field">
      <label>Интересы <span class="hint">(можно несколько)</span></label>
      <div class="pillselect">
        ${interestsList.map(i => `<button type="button" class="pillopt ${buildTripDraft.interests.includes(i)?'sel':''}" onclick="toggleInterest('${i}', this)">${i}</button>`).join('')}
      </div>
    </div>

    <div class="field">
      <label>Темп путешествия</label>
      <div class="pillselect">
        ${paceList.map(p => `<button type="button" class="pillopt ${buildTripDraft.pace===p?'sel':''}" onclick="setPace('${p}', this)">${p}</button>`).join('')}
      </div>
    </div>

    <div class="field">
      <label>Что обязательно хотите увидеть</label>
      <textarea placeholder="Опишите своими словами" oninput="buildTripDraft.mustSee=this.value">${buildTripDraft.mustSee}</textarea>
    </div>

      <label>Что точно не хотите</label>
      <textarea placeholder="Опционально" oninput="buildTripDraft.avoid=this.value">${buildTripDraft.avoid}</textarea>
    </div>

    <div class="field" id="f-contact">
      <label>Контакт для связи</label>
      <input type="text" placeholder="Telegram, телефон или email" value="${buildTripDraft.contact}" oninput="buildTripDraft.contact=this.value">
      <div class="error-msg">Укажите, как с вами связаться</div>
    </div>

    <button class="btn btn-block btn-lg" onclick="submitBuildTrip()">Отправить запрос ${ic('send')}</button>
  </div>
  `;
}
function tripNights(){
  if(!buildTripDraft.dateFrom || !buildTripDraft.dateTo) return 0;
  const from = new Date(buildTripDraft.dateFrom);
  const to = new Date(buildTripDraft.dateTo);
  const diff = Math.round((to - from) / 86400000);
  return diff > 0 ? diff : 0;
}
function nightsWord(n){
  const mod10 = n % 10, mod100 = n % 100;
  if(mod10===1 && mod100!==11) return 'ночь';
  if([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return 'ночи';
  return 'ночей';
}
function setTripDate(which, value){
  const dateField = document.getElementById('f-dates');
  if(which==='from') buildTripDraft.dateFrom = value; else buildTripDraft.dateTo = value;
  if(buildTripDraft.dateFrom && buildTripDraft.dateTo && buildTripDraft.dateTo < buildTripDraft.dateFrom){
    dateField.classList.add('invalid');
    haptic('error');
    return;
  }
  dateField.classList.remove('invalid');
  const nights = tripNights();
  document.getElementById('date-range-nights').textContent = nights ? `${nights} ${nightsWord(nights)} путешествия` : 'Выберите даты «с» и «по»';
  // keep the "по" field's min in sync with whatever "с" was just set to
  if(which==='from'){
    const toInput = dateField.querySelectorAll('input[type="date"]')[1];
    if(toInput) toInput.min = value || new Date().toISOString().slice(0,10);
  }
  haptic('light');
}
function stepPeople(d){
  buildTripDraft.people = Math.max(1, Math.min(20, buildTripDraft.people + d));
  document.getElementById('people-count').textContent = buildTripDraft.people;
  haptic('light');
}
function toggleInterest(i, btn){
  const idx = buildTripDraft.interests.indexOf(i);
  if(idx===-1) buildTripDraft.interests.push(i); else buildTripDraft.interests.splice(idx,1);
  btn.classList.toggle('sel');
}
function setPace(p, btn){
  buildTripDraft.pace = p;
  btn.parentElement.querySelectorAll('.pillopt').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
}

</script>



<script>
function submitBuildTrip(){
  const dateField = document.getElementById('f-dates');
  if(buildTripDraft.dateFrom && buildTripDraft.dateTo && buildTripDraft.dateTo < buildTripDraft.dateFrom){
    dateField.classList.add('invalid');
    dateField.scrollIntoView({behavior:'smooth', block:'center'});
    haptic('error');
    return;
  }
  dateField.classList.remove('invalid');
  const contactField = document.getElementById('f-contact');
  if(!buildTripDraft.contact.trim()){
    contactField.classList.add('invalid');
    contactField.scrollIntoView({behavior:'smooth', block:'center'});
    haptic('error');
    return;
  }
  contactField.classList.remove('invalid');
  const payload = { type:'build_trip', ...buildTripDraft, submittedAt: new Date().toISOString() };
  track('application_submit', { type:'build_trip' });
  const sent = sendToBot(payload);
  STATE.applications.unshift({ id:'req-'+Date.now(), type:'Индивидуальное путешествие', payload, date: new Date().toLocaleDateString('ru-RU') });
  haptic('success');
  showResultSheet('Заявка отправлена', 'Мы изучим запрос и свяжемся с вами в ближайшее время.', () => go('home'));
}

const applyDraft = { name:'', contact:'', people:1, comment:'' };
function openApplyModal(kind, refId){
  applyDraft.name=''; applyDraft.contact=''; applyDraft.people=1; applyDraft.comment='';
  let refLabel = '';
  if(kind==='tour'){ const t=getTour(refId); refLabel = t.dest; }
  if(kind==='person'){ const p=getPerson(refId); refLabel = p.name; }
  if(kind==='event'){ const e=getEvent(refId); refLabel = e.title; }
  const sheet = document.getElementById('sheet-content');
  sheet.innerHTML = `
    <h3 style="margin-bottom:4px;">Заявка</h3>
    <p style="margin-bottom:18px;">${refLabel}</p>
    <div class="form-wrap" style="padding:0; text-align:left;">
      <div class="field" id="am-name">
        <label>Имя</label>
        <input type="text" placeholder="Как к вам обращаться" oninput="applyDraft.name=this.value">
      </div>
      <div class="field" id="am-contact">
        <label>Контакт</label>
        <input type="text" placeholder="Telegram, телефон или email" oninput="applyDraft.contact=this.value">
        <div class="error-msg">Укажите контакт для связи</div>
      </div>
      <div class="field">
        <label>Количество человек</label>
        <div class="stepper">
          <button type="button" class="stepbtn" onclick="stepApplyPeople(-1)">–</button>
          <span class="stepval" id="apply-people-count">1</span>
          <button type="button" class="stepbtn" onclick="stepApplyPeople(1)">+</button>
        </div>
      </div>
      <div class="field">
        <label>Комментарий <span class="hint">(опционально)</span></label>
        <textarea placeholder="Вопросы или пожелания" oninput="applyDraft.comment=this.value"></textarea>
      </div>
    </div>
    <button class="btn btn-block btn-lg" onclick="submitApply('${kind}','${refId}','${refLabel.replace(/'/g,"")}')">Отправить заявку</button>
  `;
  document.getElementById('overlay').classList.add('active');
  haptic('light');
}
function stepApplyPeople(d){
  applyDraft.people = Math.max(1, Math.min(20, applyDraft.people + d));
  document.getElementById('apply-people-count').textContent = applyDraft.people;
}
function submitApply(kind, refId, refLabel){
  const contactField = document.getElementById('am-contact');
  if(!applyDraft.contact.trim()){
    contactField.classList.add('invalid');
    haptic('error');
    return;
  }
  const payload = { type:'apply', kind, refId, refLabel, ...applyDraft, submittedAt: new Date().toISOString() };
  track('application_submit', { type:'apply_'+kind, refId });
  sendToBot(payload);
  const typeLabels = { tour:'Заявка на тур', person:'Заявка своему человеку', event:'Заявка на мероприятие' };
  STATE.applications.unshift({ id:'req-'+Date.now(), type:`${typeLabels[kind]}: ${refLabel}`, payload, date: new Date().toLocaleDateString('ru-RU') });
  closeSheet();
  haptic('success');
  setTimeout(() => showResultSheet('Заявка отправлена', 'Мы свяжемся с вами в ближайшее время, чтобы подтвердить детали.', null), 260);
}

/* ---------- misc after-render hooks ---------- */
function afterRender(){
  document.getElementById('overlay').onclick = (e) => { if(e.target.id==='overlay') closeSheet(); };

  // images that were already cached won't reliably re-fire onload — flip them in directly
  document.querySelectorAll('img.imgload').forEach(img => { if(img.complete) img.classList.add('loaded'); });

  // reveal-on-scroll fade/slide-up was removed: it replayed on every screen
  // render (not just on real scroll-into-view), which made already-visible
  // cards flash/blink on each navigation. .reveal elements now render at
  // full opacity immediately — no observer needed.

  // count-up stat numbers (49.5K, 1M+, 20+ ...)
  document.querySelectorAll('[data-countup]').forEach(el => animateCountUp(el));

  // guide strip drifts right on its own; pauses while the user is
  // touching/dragging/wheeling it, and simply stops once it reaches the
  // end — it never jumps back to the start, so it can't "go in a circle".
  initHscrollAutoplay();
}

function initHscrollAutoplay(){
  document.querySelectorAll('.hscroll').forEach(el => {
    if(el.dataset.autoplayBound) return; // one loop per element instance
    el.dataset.autoplayBound = '1';
    const SPEED = 0.35; // px/frame — slow, ambient drift
    const RESUME_DELAY = 2600; // ms of no interaction before drifting resumes
    let paused = false;
    let resumeTimer = null;
    function pauseForAWhile(){
      paused = true;
      clearTimeout(resumeTimer);
      resumeTimer = setTimeout(() => { paused = false; }, RESUME_DELAY);
    }
    el.addEventListener('touchstart', pauseForAWhile, { passive:true });
    el.addEventListener('touchmove', pauseForAWhile, { passive:true });
    el.addEventListener('mousedown', pauseForAWhile);
    el.addEventListener('wheel', pauseForAWhile, { passive:true });
    (function tick(){
      if(!el.isConnected) return; // element was replaced by a re-render — drop this loop
      if(!paused){
        const max = el.scrollWidth - el.clientWidth;
        if(el.scrollLeft < max) el.scrollLeft += SPEED;
      }
      requestAnimationFrame(tick);
    })();
  });
}

function animateCountUp(el){
  const raw = el.getAttribute('data-countup');
  const match = raw.match(/^([\d.]+)(.*)$/);
  if(!match){ el.textContent = raw; return; }
  const target = parseFloat(match[1]);
  const suffix = match[2] || '';
  const decimals = (match[1].split('.')[1] || '').length;
  const duration = 900;
  const start = performance.now();
  function tick(now){
    const p = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - p, 3); // ease-out-cubic
    const val = (target * eased).toFixed(decimals);
    el.textContent = val + suffix;
    if(p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
